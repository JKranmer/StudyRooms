name: studyrooms

services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: runtime
    image: studyrooms-bot:local
    # O token só entra em tempo de execução, lido do `.env` da raiz (nunca na imagem).
    # BOT_ENV_FILE permite apontar outro arquivo, por exemplo um com valores falsos para teste.
    env_file:
      - path: ${BOT_ENV_FILE:-.env}
        required: true
    # tini como PID 1: repassa SIGINT e SIGTERM ao Node e recolhe processos órfãos.
    init: true
    # Códigos de saída: 0 no encerramento pedido; 78 para erro de configuração (token inválido,
    # allowlist malformada, BOT_DATABASE_URL ausente, intents recusadas); 1 para as demais falhas.
    # Erro de rede no login não derruba o bot: ele tenta de novo, com espera crescente.
    # O Docker não filtra o código de saída na política de reinício: na VM, quem reinicia é o
    # systemd (deploy/systemd/studyrooms-bot.service), que volta após o boot e não reinicia o 78.
    # Por isso o Docker não reinicia o bot; localmente, ele roda em primeiro plano.
    restart: "no"
    # O bot sai em até 3 s depois do sinal, mesmo com login ou reconexão pendentes.
    stop_grace_period: 10s
    read_only: true
    # Única pasta gravável: a fila em disco dos eventos ainda não gravados no banco. Sobrevive a
    # `docker compose down` e a reinícios; só `down -v` a apaga (e, com ela, o que estiver pendente).
    volumes:
      - bot-queue:/var/lib/studyrooms-bot
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Postgres local, a mesma versão maior usada nos testes (Testcontainers). Credenciais vêm do
  # `.env` da raiz (POSTGRES_*). Sem POSTGRES_PASSWORD, o container não sobe e o log diz por quê.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyrooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-studyrooms}
      TZ: UTC
      PGTZ: UTC
    # Só na interface local da máquina, nunca na rede.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Pela TCP: durante a inicialização, o servidor temporário só escuta no socket local,
    # então o container só fica saudável quando o servidor definitivo aceita conexões.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Fila em disco do bot (F1-47): eventos que ainda não chegaram ao banco.
  bot-queue:
  # Dados do banco local. `docker compose down` mantém; só `down -v` apaga.
  db-data:
